<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Agromarbanka Panel</title></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script>
<script>
(function(){
  function normalize(s){return (s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
  function enhance(){
    if(!normalize(location.hash+" "+location.pathname+" "+document.body.innerText.slice(0,800)).includes("raport")) return;
    document.querySelectorAll("select").forEach(function(sel){
      if(sel.dataset.searchEnhanced==="1") return;
      var nearby=normalize((sel.closest("label,div,section,form")||document.body).innerText.slice(0,500));
      if(!(nearby.includes("kontrah") || sel.options.length>20)) return;
      sel.dataset.searchEnhanced="1";
      var all=Array.from(sel.options).map(function(o){return {value:o.value,text:o.text,selected:o.selected};});
      var wrap=document.createElement("div"); wrap.className="searchable-client-select";
      var input=document.createElement("input"); input.className="searchable-client-input"; input.placeholder="Szukaj kontrahenta...";
      var hint=document.createElement("div"); hint.className="searchable-client-hint";
      sel.parentNode.insertBefore(wrap, sel); wrap.appendChild(input); wrap.appendChild(sel); wrap.appendChild(hint);
      function render(){
        var q=normalize(input.value), cur=sel.value; sel.innerHTML=""; var count=0;
        all.forEach(function(o,i){ if(i===0 || !q || normalize(o.text).includes(q)){var opt=document.createElement("option"); opt.value=o.value; opt.textContent=o.text; if(o.value===cur) opt.selected=true; sel.appendChild(opt); count++;}});
        hint.textContent="Pokazano "+count+" z "+all.length+". Wpisz fragment nazwy, aby zawęzić listę.";
      }
      input.addEventListener("input", render); render();
    });
  }
  document.addEventListener("DOMContentLoaded", enhance);
  setInterval(enhance, 1200);
})();
</script>


<script>
(function(){
  if(window.__agroClientAutocompleteV209) return;
  window.__agroClientAutocompleteV209 = true;

  function normalize(s){
    return (s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  }

  function enhance(){
    const bodyText = normalize(location.hash + " " + location.pathname + " " + document.body.innerText.slice(0,1200));
    if(!bodyText.includes("raport")) return;

    document.querySelectorAll("select").forEach(function(sel){
      if(sel.dataset.autocompleteV209 === "1") return;

      const nearby = normalize((sel.closest("label,div,section,form") || document.body).innerText.slice(0,700));
      const looksLikeClientSelect = nearby.includes("kontrah") || sel.options.length > 20;
      if(!looksLikeClientSelect) return;

      sel.dataset.autocompleteV209 = "1";
      sel.classList.add("searchable-client-dropdown");

      const all = Array.from(sel.options).map(function(o, idx){
        return { value:o.value, text:o.textContent || o.innerText || "", idx:idx };
      });

      const wrap = document.createElement("div");
      wrap.className = "searchable-client-select";

      const input = document.createElement("input");
      input.className = "searchable-client-input";
      input.placeholder = "Wpisz nazwę kontrahenta...";
      input.autocomplete = "off";

      const list = document.createElement("div");
      list.className = "searchable-client-suggestions";
      list.style.display = "none";

      const clear = document.createElement("button");
      clear.type = "button";
      clear.className = "searchable-client-clear";
      clear.textContent = "Wszyscy kontrahenci";

      const hint = document.createElement("div");
      hint.className = "searchable-client-hint";

      sel.parentNode.insertBefore(wrap, sel);
      wrap.appendChild(input);
      wrap.appendChild(sel);
      wrap.appendChild(list);
      wrap.appendChild(clear);
      wrap.appendChild(hint);

      function currentText(){
        const opt = all.find(function(o){ return o.value === sel.value; });
        if(!opt || !sel.value) return "";
        return opt.text;
      }

      function applyValue(value, text){
        sel.value = value || "";
        input.value = value ? text : "";
        sel.dispatchEvent(new Event("change", { bubbles:true }));
        list.style.display = "none";
        hint.textContent = value ? "Wybrano: " + text : "Wybrano: wszyscy kontrahenci";
      }

      function render(){
        const q = normalize(input.value.trim());
        list.innerHTML = "";

        let filtered = all.filter(function(o, idx){
          if(idx === 0) return !q;
          if(!q) return idx < 40;
          return normalize(o.text).includes(q);
        }).slice(0, 80);

        if(q && filtered.length === 0){
          const empty = document.createElement("div");
          empty.className = "searchable-client-option";
          empty.textContent = "Brak wyników";
          list.appendChild(empty);
          list.style.display = "block";
          hint.textContent = "Brak wyników dla wpisanej frazy.";
          return;
        }

        filtered.forEach(function(o){
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "searchable-client-option" + (o.value === sel.value ? " is-selected" : "");
          btn.textContent = o.idx === 0 ? "Wszyscy kontrahenci" : o.text;
          btn.addEventListener("mousedown", function(e){
            e.preventDefault();
            applyValue(o.value, o.idx === 0 ? "" : o.text);
          });
          list.appendChild(btn);
        });

        list.style.display = (document.activeElement === input || q) ? "block" : "none";
        hint.textContent = "Pokazano " + filtered.length + " z " + all.length + ". Kliknij kontrahenta z listy.";
      }

      input.addEventListener("input", render);
      input.addEventListener("focus", render);
      input.addEventListener("blur", function(){
        setTimeout(function(){ list.style.display = "none"; }, 180);
      });
      clear.addEventListener("click", function(){ applyValue("", ""); render(); });

      if(sel.value){
        input.value = currentText();
      }
      render();
    });
  }

  document.addEventListener("DOMContentLoaded", enhance);
  setInterval(enhance, 1000);
})();
</script>

<script>
(function(){
  if(window.__agroEditHistoryV211) return;
  window.__agroEditHistoryV211 = true;

  function txt(el){ return (el && el.innerText || "").trim(); }
  function looksLikeOperationContainer(el){
    const t = txt(el).toLowerCase();
    return (
      (t.includes("wydano") || t.includes("zwrócono") || t.includes("operac") || t.includes("dokument")) &&
      (t.includes("kontrahent") || t.includes("opakowanie") || t.includes("magazyn") || t.includes("ilość") || t.includes("ilosc"))
    );
  }

  function findSupabase(){
    try{
      if(window.supabase) return window.supabase;
      if(window.__supabase) return window.__supabase;
      for(const k of Object.keys(window)){
        const v = window[k];
        if(v && typeof v.from === "function" && typeof v.auth === "object") return v;
      }
    }catch(e){}
    return null;
  }

  function extractOperationId(el){
    const text = txt(el);
    const patterns = [
      /operacja[_\s-]*id[:\s#]*([0-9]+)/i,
      /id[:\s#]*([0-9]+)/i,
      /#([0-9]{1,10})/
    ];
    for(const p of patterns){
      const m = text.match(p);
      if(m) return m[1];
    }
    const attrId = el.getAttribute("data-id") || el.getAttribute("data-operation-id") || el.getAttribute("data-operacja-id");
    return attrId || "";
  }

  async function loadHistory(operationId){
    const client = findSupabase();
    if(!client || !operationId) return {items:[], note:"Brak połączenia z Supabase lub brak ID operacji."};
    try{
      const {data, error} = await client
        .from("historia_edycji_operacji")
        .select("*")
        .eq("operacja_id", operationId)
        .order("zmieniono_o", {ascending:false});
      if(error) return {items:[], note:"Nie udało się pobrać historii: " + error.message};
      return {items:data || [], note:""};
    }catch(e){
      return {items:[], note:"Błąd pobierania historii: " + e.message};
    }
  }

  function renderHistoryBox(container, operationId, result){
    let box = container.querySelector(".edit-history-box");
    if(!box){
      box = document.createElement("div");
      box.className = "edit-history-box";
      container.appendChild(box);
    }
    let html = "<h4>Historia edycji</h4>";
    if(!operationId){
      html += "<div class='edit-history-row'>Nie znaleziono ID operacji przy tym dokumencie.</div>";
    }else if(result.note){
      html += "<div class='edit-history-row'>" + result.note + "</div>";
    }else if(!result.items.length){
      html += "<div class='edit-history-row'>Brak zapisanych edycji dla tej operacji.</div>";
    }else{
      result.items.forEach(function(h){
        const who = h.zmienione_przez || h.zmienione_przez_id || "nieznany użytkownik";
        const when = h.zmieniono_o ? new Date(h.zmieniono_o).toLocaleString("pl-PL") : "";
        const desc = h.opis_zmiany || "Edycja dokumentu";
        html += "<div class='edit-history-row'>";
        html += "<div class='edit-history-meta'>" + who + " — " + when + "</div>";
        html += "<div class='edit-history-desc'>" + desc + "</div>";
        if(h.przed_zmiana || h.po_zmianie){
          html += "<details class='edit-history-json'><summary>Szczegóły zmiany</summary>";
          html += "Przed zmianą:\\n" + JSON.stringify(h.przed_zmiana || {}, null, 2);
          html += "\\n\\nPo zmianie:\\n" + JSON.stringify(h.po_zmianie || {}, null, 2);
          html += "</details>";
        }
        html += "</div>";
      });
    }
    box.innerHTML = html;
  }

  function enhance(){
    document.querySelectorAll("section, article, .card, .panel, .operation, .operacja, tr, div").forEach(function(el){
      if(el.dataset.editHistoryEnhanced === "1") return;
      if(!looksLikeOperationContainer(el)) return;

      // avoid too many tiny divs
      if(el.innerText && el.innerText.length < 40) return;
      if(el.querySelector(".edit-history-button")) return;

      const operationId = extractOperationId(el);
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "edit-history-button";
      btn.textContent = "Historia edycji";
      btn.addEventListener("click", async function(){
        btn.textContent = "Ładowanie historii...";
        const result = await loadHistory(operationId);
        renderHistoryBox(el, operationId, result);
        btn.textContent = "Historia edycji";
      });
      el.appendChild(btn);
      el.dataset.editHistoryEnhanced = "1";
    });
  }

  document.addEventListener("DOMContentLoaded", enhance);
  setInterval(enhance, 1500);
})();
</script>
