<!doctype html><html><head>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#17304a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="/icon.svg">
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Agromarbanka Panel</title></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script>
<script>
(function(){
  if(window.__agroStage1V216) return;
  window.__agroStage1V216 = true;

  function norm(s){
    return (s||"").toString().trim().replace(/\s+/g," ").toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  }

  function pageText(){
    return norm(location.hash+" "+location.pathname+" "+document.body.innerText.slice(0,1600));
  }

  function isReportsPage(){
    return pageText().includes("raport");
  }

  function isOperationsPage(){
    const t = pageText();
    return t.includes("operac") || t.includes("wydanie") || t.includes("zwrot");
  }

  function isClientsPage(){
    const t = pageText();
    return t.includes("kontrahent") && (t.includes("dodaj") || t.includes("aktywn") || t.includes("ukry"));
  }

  function optionTexts(select){
    return Array.from(select.options || []).map(o => norm(o.textContent || o.innerText || ""));
  }

  function enhanceReportSelects(){
    if(!isReportsPage()) return;

    document.querySelectorAll("select").forEach(function(sel){
      if(sel.dataset.stage1Search === "1") return;
      const nearby = norm((sel.closest("label,div,section,form") || document.body).innerText.slice(0,800));
      if(!(nearby.includes("kontrah") || sel.options.length > 25)) return;

      sel.dataset.stage1Search = "1";
      const all = Array.from(sel.options).map(function(o, idx){
        return {value:o.value, text:o.textContent || o.innerText || "", idx};
      });

      const wrap = document.createElement("div");
      wrap.className = "stage1-report-client-search";
      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = "Szukaj kontrahenta po pierwszych literach...";
      input.className = "stage1-search-input";
      const hint = document.createElement("div");
      hint.className = "stage1-search-hint";

      sel.parentNode.insertBefore(wrap, sel);
      wrap.appendChild(input);
      wrap.appendChild(sel);
      wrap.appendChild(hint);

      function render(){
        const q = norm(input.value);
        const current = sel.value;
        sel.innerHTML = "";
        let count = 0;

        all.forEach(function(o, idx){
          const n = norm(o.text);
          const isAll = idx === 0 || !o.value;
          const match = !q || isAll || n.startsWith(q) || n.includes(" "+q) || n.includes(q);
          if(match && count < 120){
            const opt = document.createElement("option");
            opt.value = o.value;
            opt.textContent = o.text;
            if(o.value === current) opt.selected = true;
            sel.appendChild(opt);
            count++;
          }
        });
        hint.textContent = "Pokazano " + count + " z " + all.length + ".";
      }
      input.addEventListener("input", render);
      render();
    });
  }

  function clearClientAfterOperationSave(){
    document.addEventListener("click", function(e){
      const btn = e.target.closest("button");
      if(!btn) return;
      const label = norm(btn.innerText || btn.value || "");
      if(!(label.includes("zapisz") || label.includes("dodaj") || label.includes("utworz"))) return;
      if(!isOperationsPage()) return;

      setTimeout(function(){
        // czyścimy tylko pola kontrahenta w formularzu operacji, bez raportów
        document.querySelectorAll("select").forEach(function(sel){
          const nearby = norm((sel.closest("label,div,section,form") || document.body).innerText.slice(0,700));
          if(nearby.includes("kontrah") && !isReportsPage()){
            sel.value = "";
            sel.dispatchEvent(new Event("change", {bubbles:true}));
          }
        });
        document.querySelectorAll("input").forEach(function(inp){
          const ph = norm(inp.placeholder || "");
          const name = norm(inp.name || inp.id || "");
          const nearby = norm((inp.closest("label,div,section,form") || document.body).innerText.slice(0,500));
          if((ph.includes("kontrah") || name.includes("kontrah") || nearby.includes("kontrah")) && !isReportsPage()){
            // nie czyść ilości/dat/opakowań
            if(inp.type === "text" || inp.type === "search"){
              inp.value = "";
              inp.dispatchEvent(new Event("input", {bubbles:true}));
              inp.dispatchEvent(new Event("change", {bubbles:true}));
            }
          }
        });
      }, 700);
    }, true);
  }

  function blockDuplicateClientNames(){
    document.addEventListener("submit", function(e){
      if(!isClientsPage()) return;
      const form = e.target;
      const inputs = Array.from(form.querySelectorAll("input"));
      const nameInput = inputs.find(inp => {
        const key = norm((inp.name||"")+" "+(inp.id||"")+" "+(inp.placeholder||""));
        return key.includes("nazwa") || key.includes("kontrah") || key.includes("name");
      });
      if(!nameInput) return;

      const value = norm(nameInput.value);
      if(!value) return;

      const existing = [];
      document.querySelectorAll("table tr, .client, .kontrahent, li, option").forEach(function(el){
        const t = norm(el.innerText || el.textContent || "");
        if(t) existing.push(t);
      });

      const duplicate = existing.some(t => t === value || t.startsWith(value+" ") || t.includes(value+";"));
      if(duplicate){
        e.preventDefault();
        e.stopPropagation();
        alert("Taki kontrahent już istnieje: " + nameInput.value);
      }
    }, true);

    document.addEventListener("click", function(e){
      const btn = e.target.closest("button");
      if(!btn || !isClientsPage()) return;
      const label = norm(btn.innerText || "");
      if(!(label.includes("dodaj") || label.includes("zapisz"))) return;

      const container = btn.closest("form, section, div") || document.body;
      const nameInput = Array.from(container.querySelectorAll("input")).find(inp => {
        const key = norm((inp.name||"")+" "+(inp.id||"")+" "+(inp.placeholder||""));
        return key.includes("nazwa") || key.includes("kontrah") || key.includes("name");
      });
      if(!nameInput || !nameInput.value) return;
      const value = norm(nameInput.value);

      const options = Array.from(document.querySelectorAll("option, table tr, li")).map(el => norm(el.innerText || el.textContent || ""));
      const duplicate = options.some(t => t === value || t.startsWith(value+" "));
      if(duplicate){
        e.preventDefault();
        e.stopPropagation();
        alert("Taki kontrahent już istnieje: " + nameInput.value);
      }
    }, true);
  }

  function init(){
    enhanceReportSelects();
  }

  clearClientAfterOperationSave();
  blockDuplicateClientNames();
  document.addEventListener("DOMContentLoaded", init);
  setInterval(enhanceReportSelects, 1200);
})();
</script>

</body></html>
